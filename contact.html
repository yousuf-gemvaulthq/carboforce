<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Carbo-FORCE GmbH in Kassel, Germany." />
    <title>Contact — CARBO-FORCE</title>
  </head>
  <body>
    <div id="nav-root"></div>

    <main>
      <section class="contact-hero">
        <img src="/img/plant-real.webp" alt="A real Carbo-CAP-TEC plant at a CARBO-FORCE site" class="contact-still" />
        <div class="contact-hero-scrim"></div>
        <div class="container contact-hero-copy">
          <p data-i18n="contact.hero.line"></p>
        </div>
      </section>

      <section class="section-pad contact-body">
        <div class="container contact-grid">
          <form class="contact-form" id="contact-form" novalidate>
            <div class="field">
              <label for="cf-name" data-i18n="contact.form.name"></label>
              <input id="cf-name" name="name" type="text" required autocomplete="name" />
            </div>
            <div class="field">
              <label for="cf-email" data-i18n="contact.form.email"></label>
              <input id="cf-email" name="email" type="email" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="cf-message" data-i18n="contact.form.message"></label>
              <textarea id="cf-message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="contact-submit" data-i18n="contact.form.submit"></button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </form>

          <div class="contact-details">
            <h3 id="contact-company-name"></h3>
            <p id="contact-address"></p>
            <a id="contact-email" href="#"></a>
            <a id="contact-phone" href="#"></a>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-root"></div>

    <script type="module" src="/src/contact.ts"></script>
  </body>
</html>
