<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Patented Carbo-CAP-TEC pyrolysis plants from Kassel, Germany turn organic residues into stable biochar that permanently binds CO2 while producing more energy than they consume." />
    <title>CARBO-FORCE — Carbo-CAP-TEC Pyrolysis Plants</title>
  </head>
  <body>
    <div id="nav-root"></div>

    <main>
      <section class="hero-scrub" id="hero-scrub">
        <div class="hero-scrub-sticky">
          <canvas id="hero-canvas"></canvas>
          <div class="hero-scrub-overlay"></div>
          <div class="hero-copy">
            <h1 class="hero-line hero-line-1" data-i18n="home.hero.headline1"></h1>
            <h1 class="hero-line hero-line-2" data-i18n="home.hero.headline2"></h1>
            <div class="hero-line hero-brand">
              <span class="hero-brand-text" data-i18n="home.hero.brandLine"></span>
            </div>
          </div>
          <div class="hero-scroll-hint" data-i18n="home.hero.scrollHint"></div>
          <div class="hero-progress"><div class="hero-progress-bar" id="hero-progress-bar"></div></div>
        </div>
      </section>

      <section class="section-pad stats-band">
        <div class="container stats-grid" id="stats-grid">
          <div class="stat-card">
            <div class="stat-value" data-stat="0">0</div>
            <p class="stat-label" data-i18n="home.stats.0.label"></p>
          </div>
          <div class="stat-card">
            <div class="stat-value" data-stat="1">0</div>
            <p class="stat-label" data-i18n="home.stats.1.label"></p>
          </div>
          <div class="stat-card">
            <div class="stat-value" data-stat="2">0</div>
            <p class="stat-label" data-i18n="home.stats.2.label"></p>
          </div>
        </div>
      </section>

      <section class="section-pad problem-solver">
        <div class="container problem-grid">
          <div class="problem-copy">
            <span class="eyebrow" data-i18n="home.problemSolver.eyebrow"></span>
            <h2 data-i18n="home.problemSolver.title"></h2>
            <p data-i18n="home.problemSolver.body"></p>
          </div>
          <div class="problem-visual">
            <img src="/img/plant-real.webp" alt="A real Carbo-CAP-TEC plant in operation at a CARBO-FORCE site" loading="lazy" />
          </div>
        </div>
      </section>

      <div id="partners-root"></div>

      <section class="section-pad home-cta">
        <div class="container">
          <h2 data-i18n="home.cta.title"></h2>
          <div class="cta-row">
            <a href="/process.html" class="btn btn-primary" data-i18n="home.cta.seeProcess"></a>
            <a href="/about.html" class="btn btn-outline" data-i18n="home.cta.aboutUs"></a>
            <a href="/contact.html" class="btn btn-outline" data-i18n="home.cta.arrangeMeeting"></a>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
